name: Swift
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: swift test -c release
      - run: bash scripts/build-app.sh
      - name: Typecheck integration example
        run: swiftc -swift-version 6 -typecheck -target "$(uname -m)-apple-macosx13.0" -I "$(swift build --show-bin-path)/Modules" Examples/PlayerPresence.swift
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift test
